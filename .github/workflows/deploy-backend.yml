name: Deploy backend

# Enable by setting repository variable DEPLOY_ENABLED=true and adding secrets
# DEPLOY_HOST, DEPLOY_USER, DEPLOY_SSH_KEY (private key for the Oracle VM deploy user).
on:
  push:
    branches: [main]
    paths: ["backend/**", "infra/**"]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  image:
    if: vars.DEPLOY_ENABLED == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: backend/Dockerfile
          platforms: linux/arm64
          push: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/doctune-backend:${{ github.sha }}
            ghcr.io/${{ github.repository_owner }}/doctune-backend:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: infra/inference.Dockerfile
          platforms: linux/arm64
          push: true
          build-args: BASE=ghcr.io/${{ github.repository_owner }}/doctune-backend:${{ github.sha }}
          tags: |
            ghcr.io/${{ github.repository_owner }}/doctune-inference:${{ github.sha }}
            ghcr.io/${{ github.repository_owner }}/doctune-inference:latest

  deploy:
    needs: image
    runs-on: ubuntu-latest
    environment: production  # add required reviewers in GitHub settings
    steps:
      - name: Pull image, migrate, restart
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          script: |
            set -e
            cd ~/doctune/infra
            export IMAGE_TAG=${{ github.sha }}
            docker compose pull
            docker compose run --rm api alembic upgrade head
            docker compose up -d --remove-orphans
