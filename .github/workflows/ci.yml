name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: doctune
          POSTGRES_PASSWORD: doctune
          POSTGRES_DB: doctune
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U doctune" --health-interval 3s --health-retries 20
      redis:
        image: redis:7-alpine
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping" --health-interval 3s --health-retries 20
    env:
      TEST_PG: doctune:doctune@localhost:5432
      TEST_REDIS_URL: redis://localhost:6379/0
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - run: uv sync --frozen
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run mypy src
      - run: uv run pytest
      - name: Models match migrations
        run: uv run alembic -x url=postgresql+psycopg://doctune:doctune@localhost:5432/doctune_test check

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          package_json_file: frontend/package.json
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm typecheck:preview
      - run: pnpm test
      - run: pnpm build

  notebook:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: notebook
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - run: uv sync --extra dev
      - run: uv run ruff check . && uv run ruff format --check .
      - run: uv run pytest

  api-types-drift:
    # fails when the backend API changed but frontend/src/lib/api/schema.d.ts was not regenerated
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - uses: pnpm/action-setup@v4
        with:
          package_json_file: frontend/package.json
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: cd backend && uv sync --frozen && uv run python -m doctune.openapi > ../frontend/openapi.json
      - run: cd frontend && pnpm install --frozen-lockfile && pnpm gen:api
      - run: git diff --exit-code -- frontend/src/lib/api/schema.d.ts
