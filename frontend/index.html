<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="light dark" />
    <title>DocTune</title>
    <script>
      // Apply the saved theme before first paint (no light/dark flash). Keep in sync with src/components/theme/.
      try {
        var t = localStorage.getItem('doctune-theme')
        // anything other than 'light' / 'dark' (missing or invalid) means 'system', like readStoredTheme()
        var dark = t === 'dark' || (t !== 'light' && matchMedia('(prefers-color-scheme: dark)').matches)
        document.documentElement.classList.toggle('dark', dark)
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
