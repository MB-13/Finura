[project]
name = "doctune"
version = "0.1.0"
description = "DocTune backend: FastAPI API and Celery workers"
authors = [
    { name = "mahavir bharadva", email = "mahavir.bharadva@9spl.com" }
]
requires-python = ">=3.12"
dependencies = [
    "alembic>=1.20.0",
    "asyncpg>=0.32.0",
    "celery[redis]>=5.6.3",
    "charset-normalizer>=3.5.2",
    "cryptography>=50.0.2",
    "fastapi[standard]>=0.142.2",
    "filetype>=1.2.0",
    "httpx>=0.28.1",
    "huggingface-hub>=1.33.0",
    "jinja2>=3.1.6",
    "mammoth>=1.13.0",
    "markdownify>=1.2.3",
    "openai>=3.26.0",
    "pgvector>=0.5.0",
    "psycopg[binary]>=3.3.6",
    "pydantic-settings>=2.15.0",
    "pyjwt[crypto]>=2.15.1",
    "pymupdf>=1.28.2",
    "pymupdf4llm>=1.28.2",
    "pytesseract>=0.3.13",
    "redis>=6.4.0",
    "sentry-sdk>=2.71.0",
    "sqlalchemy[asyncio]>=2.1.3",
    "sse-starlette>=3.5.0",
    "structlog>=26.1.0",
    "tiktoken>=0.14.0",
]

[project.optional-dependencies]
ml = [
    "sentence-transformers>=6.1.0",
    "torch>=2.6",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[dependency-groups]
dev = [
    "celery-types>=0.26.0",
    "mypy>=2.4.0",
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
    "respx>=0.23.1",
    "ruff>=0.16.10",
]

[tool.ruff]
line-length = 120
target-version = "py312"
extend-exclude = ["alembic/versions"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "S", "SIM", "RUF", "ASYNC"]
ignore = ["S101", "RUF001", "RUF002", "RUF003"]  # asserts; typographic characters in user-facing text

[tool.ruff.lint.isort]
known-third-party = ["alembic"]
known-first-party = ["doctune"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S105", "S106"]

[tool.mypy]
python_version = "3.12"
strict = true
plugins = ["pydantic.mypy"]
files = ["src"]

[[tool.mypy.overrides]]
module = ["pgvector.*", "sse_starlette.*", "pymupdf.*", "pymupdf4llm.*", "pytesseract.*", "mammoth.*", "markdownify.*", "sentence_transformers.*", "filetype.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "session"
asyncio_default_test_loop_scope = "session"
addopts = "-q"

# torch for the `ml` extra (embeddings) comes from the CPU-only index: no multi-GB CUDA wheels
[tool.uv.sources]
torch = [{ index = "pytorch-cpu" }]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true
